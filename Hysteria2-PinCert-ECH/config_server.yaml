listeners:
  - name: "hysteria2-server"
    type: hysteria2
    port: 443
    listen: "0.0.0.0"
    users:
      user1: "password1"
      user2: "password2"
    ignore-client-bandwidth: true
    # masquerade: "https://example.com:443" #伪装地址
    alpn: ["h3"]
    certificate: "./server.crt" # 证书的路径
    private-key: "./server.key" # 私钥路径
    # 如果填写则开启ech(可由 mihomo generate ech-keypair <明文域名> 生成)
    ech-key: |
      -----BEGIN ECH KEYS-----
      ACATwY30o/RKgD6hgeQxwrSiApLaCgU+HKh7B6SUrAHaDwBD/g0APwAAIAAgHjzK
      madSJjYQIf9o1N5GXjkW4DEEeb17qMxHdwMdNnwADAABAAEAAQACAAEAAwAIdGVz
      dC5jb20AAA==
      -----END ECH KEYS-----
